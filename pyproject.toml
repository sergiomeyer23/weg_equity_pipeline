[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weg-equity-pipeline"
version = "1.0.0"
description = "Institutional-grade fundamental analysis pipeline for WEG S.A. (WEGE3.SA) on B3"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Quantitative Equity Research", email = "research@example.com"}]
keywords = ["equity-research", "dcf", "valuation", "b3", "wege3", "fundamental-analysis"]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "yfinance>=0.2.46",
    "requests>=2.31.0",
    "plotly>=5.18.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0.1",
    "openpyxl>=3.1.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "black>=23.0", "ruff>=0.1.0", "mypy>=1.0"]
dashboard = ["streamlit>=1.28.0"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N"]
